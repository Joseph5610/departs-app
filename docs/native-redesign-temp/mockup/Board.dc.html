<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Návrh: odchody</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="mock.css">
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face { font-family: 'Geist Variable'; font-style: normal; font-display: swap; font-weight: 100 900; src: url(/_blob/bfb99ab00ab27c1f4727d7cb42a8f1d5) format('woff2-variations'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Geist Variable'; font-style: normal; font-display: swap; font-weight: 100 900; src: url(/_blob/e70cefe43f47d3bd5f067afbc5826a84) format('woff2-variations'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
body { margin: 0; }
</style>
</helmet>
<div class="phone root-type th-dark {{modeClass}} {{hitClass}}">
  <img class="map" src="/_blob/865bbeb5ef36d05a251b1ba44071d2ea" alt="">
  <div class="dim" style="opacity: {{dim}}; transition: opacity .4s;"></div>
  <div class="nb-sheet" style="top: {{top}}px; transition: top .5s cubic-bezier(.32,.72,0,1);">
    <div class="mat rim rim-top" style="background: {{matBackground}}; transition: background .5s;"></div>
    <div class="nb-in nb-fade">
      <button class="grab" aria-label="Zmeniť výšku panela" onClick="{{toggleDetent}}"><span></span></button>

      <div class="nb-head">
        <span class="nb-plat">A</span>
        <h1 class="nb-title grow">Náměstí Míru</h1>
        <button class="nb-close well hit" aria-label="Zavrieť">
          <svg class="ic" style="stroke-width: 2.5;" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <div class="nb-chip-row">
        <button class="nb-open well hit">
          <svg class="ic" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 4.99-5.54 10.19-7.4 11.8a1 1 0 0 1-1.2 0C9.54 20.19 4 14.99 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
          Otvoriť Mapy
        </button>
        <span class="nb-status">
          <svg class="ic" style="color: var(--tint-mint);" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg>
          Načas
        </span>
      </div>

      <div class="nb-filters">
        <span class="nb-toggle well hit">
          <svg class="ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="16" cy="4" r="1"/><path d="m18 19 1-7-6 1"/><path d="m5 8 3-3 5.5 3-2.36 3.5"/><path d="M4.24 14.5a5 5 0 0 0 6.88 6"/><path d="M13.76 17.5a5 5 0 0 0-6.88-6"/></svg>
        </span>
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="8">
          <span class="lb lg hit" style="background: {{c.color}};">{{c.name}}</span>
        </sc-for>
      </div>

      <div class="nb-list" style="overflow-y: {{overflow}};" onScroll="{{onScroll}}" onWheel="{{onWheel}}">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
          <div class="nb-swipe" onPointerDown="{{r.onDown}}" onPointerMove="{{r.onMove}}" onPointerUp="{{r.onUp}}" onPointerCancel="{{r.onCancel}}">
          <span class="swa swa-ride" style="width: {{r.rideWidth}}px; background: {{r.rideBackground}}; color: {{r.rideColor}}; transition: {{r.swTransition}};">
            <svg class="ic" style="stroke-width: 2.25; transform: scale({{r.rideScale}});" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg>
            <span style="opacity: {{r.rideLabel}};">{{r.rideText}}</span>
          </span>
          <span class="swa swa-star" style="width: {{r.starWidth}}px; background: {{r.starBackground}}; color: {{r.starColor}}; transition: {{r.swTransition}};">
            <svg class="ic fill" style="stroke-width: 2; transform: scale({{r.starScale}});" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
            <span style="opacity: {{r.starLabel}};">{{r.starText}}</span>
          </span>
          <div class="nb-row" style="transform: translateX({{r.x}}px); transition: {{r.rowTransition}};">
            <span class="lb lg" style="background: {{r.color}}; justify-self: start;">{{r.line}}</span>
            <span class="nb-namewrap">
              <span class="nb-name">{{r.head}}</span>
              <sc-if value="{{r.starred}}" hint-placeholder-val="{{false}}">
                <svg class="ic" style="color: var(--tint-amber); fill: currentColor;" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
              </sc-if>
              <sc-if value="{{r.transfer}}" hint-placeholder-val="{{false}}">
                <svg class="ic" style="color: var(--label-2);" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.1V7a4 4 0 0 0 8 0V3.1"/><path d="m9 15-1-1"/><path d="m15 15 1-1"/><path d="M9 19c-2.8 0-5-2.2-5-5v-4a8 8 0 0 1 16 0v4c0 2.8-2.2 5-5 5Z"/><path d="m8 19-2 3"/><path d="m16 19 2 3"/></svg>
              </sc-if>
            </span>
            <span class="nb-time">
              <svg class="ic" style="color: {{r.signal}}; stroke-width: 2.5;" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
              {{r.count}}
            </span>
            <span class="nb-line2">
              <span>Odchod</span>
              <sc-if value="{{r.scheduled}}" hint-placeholder-val="{{false}}"><s>{{r.scheduled}}</s><b>{{r.time}}</b></sc-if>
              <sc-if value="{{r.onTime}}" hint-placeholder-val="{{true}}"><span>{{r.time}}</span></sc-if>
              <sc-if value="{{r.ride}}" hint-placeholder-val="{{false}}">
                <span class="nb-ride hit">
                  <svg class="ic" style="stroke-width: 2.25;" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg>
                  Moja cesta
                </span>
              </sc-if>
            </span>
            <span class="nb-amen">
              <sc-if value="{{r.accessible}}" hint-placeholder-val="{{true}}">
                <svg class="ic" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="16" cy="4" r="1"/><path d="m18 19 1-7-6 1"/><path d="m5 8 3-3 5.5 3-2.36 3.5"/><path d="M4.24 14.5a5 5 0 0 0 6.88 6"/><path d="M13.76 17.5a5 5 0 0 0-6.88-6"/></svg>
              </sc-if>
            </span>
            <span class="nb-later">
              <sc-for list="{{r.later}}" as="n" hint-placeholder-count="3">
                <span class="nb-pill hit">
                  <sc-if value="{{n.live}}" hint-placeholder-val="{{false}}">
                    <svg class="ic" style="color: oklch(0.6959 0.1491 162.48); stroke-width: 2.75;" width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
                  </sc-if>
                  {{n.label}}
                </span>
              </sc-for>
            </span>
            <sc-if value="{{r.sep}}" hint-placeholder-val="{{true}}"><span class="nb-sep"></span></sc-if>
          </div>
          </div>
        </sc-for>
      </div>
    </div>
    <div class="edge-fade"></div>
  </div>

  <div class="nb-bar" style="width: {{barWidth}}px; right: {{barRight}}px;">
    <div class="mat rim"></div>
    <button class="nb-fold" style="width: {{foldWidth}}px; opacity: {{foldOpacity}};" aria-label="Pridať do obľúbených">
      <svg class="ic" width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
    </button>
    <button class="nb-fold" style="width: {{foldWidth}}px; opacity: {{foldOpacity}};" aria-label="Zdieľať">
      <svg class="ic" width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v13"/><path d="m16 6-4-4-4 4"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/></svg>
    </button>
    <button aria-label="Viac">
      <svg class="ic" width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"detent":{"editor":"enum","options":["medium","full"],"default":"medium"},"collapsed":{"editor":"boolean","default":false},"swipeRow":{"editor":null},"swipeX":{"editor":null},"mode":{"editor":"enum","options":["glass","contrast"],"default":"glass"},"showHit":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const NIGHT = '#262050';
const TRAM = '#7A0603';
const LIVE = 'oklch(0.6959 0.1491 162.48)';
const DELAYED = 'oklch(0.74 0.17 22)';

const flag = v => v === true || v === 'true';
const SWIPE = { ARM: 72, MAX: 96, GAP: 8, LABEL: 56, SLOP: 6, EASE: '.32s cubic-bezier(.32,.72,0,1)' };

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { detent: props.detent ?? 'medium', collapsed: flag(props.collapsed), swipe: null, starred: {}, rideRow: 1 };
    this.lastTop = 0;
    this.gesture = null;
  }

  finishSwipe(commit) {
    const g = this.gesture;
    this.gesture = null;
    if (!g || g.phase !== 'swiping') return;
    const x = this.state.swipe?.x ?? 0;
    const next = { swipe: { i: g.i, x: 0, dragging: false } };
    if (commit && x <= -SWIPE.ARM) next.starred = { ...this.state.starred, [g.i]: !this.state.starred[g.i] };
    if (commit && x >= SWIPE.ARM) next.rideRow = this.state.rideRow === g.i ? null : g.i;
    this.setState(next);
  }

  withSwipe(rows) {
    const { swipe, starred, rideRow } = this.state;
    const demoRow = this.props.swipeRow === undefined ? -1 : Number(this.props.swipeRow);
    return rows.map((row, i) => {
      const x = swipe?.i === i ? swipe.x : i === demoRow ? Number(this.props.swipeX) : 0;
      const dragging = swipe?.i === i && swipe.dragging;
      const armed = Math.abs(x) >= SWIPE.ARM;
      const width = Math.max(0, Math.abs(x) - SWIPE.GAP);
      const isStar = x < 0;
      const isRide = x > 0;
      const ride = rideRow === i;
      const star = !!starred[i];
      const tint = name => `color-mix(in oklch, var(--tint-${name}) 22%, transparent)`;
      const transition = dragging ? 'background .15s, color .15s' : `width ${SWIPE.EASE}, background .15s, color .15s`;
      return {
        ...row,
        ride,
        starred: star,
        x,
        rowTransition: dragging ? 'none' : `transform ${SWIPE.EASE}`,
        swTransition: transition,
        rideWidth: isRide ? width : 0,
        starWidth: isStar ? width : 0,
        rideBackground: isRide && armed ? 'var(--tint-mint)' : tint('mint'),
        starBackground: isStar && armed ? 'var(--tint-amber)' : tint('amber'),
        rideColor: isRide && armed ? 'var(--on-mint)' : 'var(--tint-mint)',
        starColor: isStar && armed ? '#2b1a00' : 'var(--tint-amber)',
        rideScale: isRide && armed ? 1.15 : 1,
        starScale: isStar && armed ? 1.15 : 1,
        rideLabel: width >= SWIPE.LABEL ? 1 : 0,
        starLabel: width >= SWIPE.LABEL ? 1 : 0,
        rideText: ride ? 'Zrušiť' : 'Idem',
        starText: star ? 'Odobrať' : 'Pripnúť',
        onDown: e => {
          const phone = e.currentTarget.closest('.phone');
          this.gesture = { i, id: e.pointerId, x: e.clientX, y: e.clientY, phase: 'pending', scale: phone.getBoundingClientRect().height / phone.offsetHeight };
        },
        onMove: e => {
          const g = this.gesture;
          if (!g || g.id !== e.pointerId) return;
          const dx = (e.clientX - g.x) / g.scale;
          const dy = (e.clientY - g.y) / g.scale;
          if (g.phase === 'pending') {
            if (Math.max(Math.abs(dx), Math.abs(dy)) <= SWIPE.SLOP) return;
            if (Math.abs(dx) < Math.abs(dy) * 1.5) { this.gesture = null; return; }
            g.phase = 'swiping';
            e.currentTarget.setPointerCapture(e.pointerId);
          }
          this.setState({ swipe: { i, x: Math.max(-SWIPE.MAX, Math.min(SWIPE.MAX, dx)), dragging: true } });
        },
        onUp: () => this.finishSwipe(true),
        onCancel: () => this.finishSwipe(false),
      };
    });
  }

  renderVals() {
    const showHit = flag(this.props.showHit);
    const { detent, collapsed } = this.state;
    const full = detent === 'full';
    return {
      modeClass: this.props.mode === 'contrast' ? 'contrast' : '',
      hitClass: showHit ? 'show-hit' : '',
      top: full ? 56 : 371,
      dim: full ? 0.25 : 0,
      matBackground: full ? 'var(--mat-solid)' : 'var(--mat-thick)',
      overflow: full ? 'auto' : 'hidden',
      barWidth: collapsed ? 48 : 136,
      barRight: collapsed ? 16 : 127,
      foldWidth: collapsed ? 0 : 40,
      foldOpacity: collapsed ? 0 : 1,
      toggleDetent: () => this.setState({ detent: full ? 'medium' : 'full', collapsed: false }),
      onWheel: e => {
        if (!full && e.deltaY > 0) this.setState({ detent: 'full' });
        else if (full && e.deltaY < 0 && e.currentTarget.scrollTop <= 0) this.setState({ detent: 'medium', collapsed: false });
      },
      onScroll: e => {
        const { scrollTop, clientHeight, scrollHeight } = e.currentTarget;
        const top = Math.min(Math.max(0, scrollTop), scrollHeight - clientHeight);
        const delta = top - this.lastTop;
        this.lastTop = top;
        this.travel = Math.sign(this.travel ?? 0) === Math.sign(delta) ? (this.travel ?? 0) + delta : delta;
        const next = top <= 24 ? false : Math.abs(this.travel) < 24 ? this.state.collapsed : this.travel > 0;
        if (next !== this.state.collapsed) this.setState({ collapsed: next });
      },
      chips: [
        { name: '4', color: TRAM }, { name: '10', color: TRAM }, { name: '11', color: TRAM }, { name: '21', color: TRAM }, { name: '22', color: TRAM },
        { name: '91', color: NIGHT }, { name: '96', color: NIGHT }, { name: '97', color: NIGHT }, { name: '99', color: NIGHT },
      ],
      rows: this.withSwipe([
        { line: '97', color: NIGHT, head: 'Bílá Hora', count: '8:20', signal: LIVE, onTime: true, time: '00:16', accessible: true, later: [{ label: '38 min', live: true }, { label: '01:16' }, { label: '01:46' }], sep: true },
        { line: '96', color: NIGHT, head: 'Sídliště Petřiny', count: '11:29', signal: DELAYED, scheduled: '00:18', time: '00:19', later: [{ label: '40 min', live: true }, { label: '01:18', live: true }, { label: '01:48' }], sep: true },
        { line: '99', color: NIGHT, head: 'Sídliště Řepy', transfer: true, count: '25:13', signal: LIVE, onTime: true, time: '00:33', later: [{ label: '55 min', live: true }, { label: '01:33' }, { label: '02:03' }], sep: true },
        { line: '91', color: NIGHT, head: 'Divoká Šárka', count: '26:13', signal: LIVE, onTime: true, time: '00:34', accessible: true, later: [{ label: '56 min', live: true }, { label: '01:34' }, { label: '02:04' }], sep: true },
        { line: '4', color: TRAM, head: 'Čechovo náměstí', count: '4 h 12 min', signal: 'transparent', onTime: true, time: '04:28', accessible: true, later: [{ label: '04:48' }, { label: '05:08' }], sep: true },
        { line: '10', color: TRAM, head: 'Sídliště Ďáblice', count: '4 h 18 min', signal: 'transparent', onTime: true, time: '04:34', later: [{ label: '04:54' }, { label: '05:14' }], sep: true },
        { line: '22', color: TRAM, head: 'Bílá Hora', count: '4 h 26 min', signal: 'transparent', onTime: true, time: '04:42', accessible: true, later: [{ label: '05:02' }, { label: '05:22' }], sep: false },
      ]),
    };
  }
}
</script>
</body>
</html>
