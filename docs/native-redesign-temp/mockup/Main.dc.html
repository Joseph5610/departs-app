<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Návrh home sheetu</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="mock.css">
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face { font-family: 'Geist Variable'; font-style: normal; font-display: swap; font-weight: 100 900; src: url(/_blob/bfb99ab00ab27c1f4727d7cb42a8f1d5) format('woff2-variations'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Geist Variable'; font-style: normal; font-display: swap; font-weight: 100 900; src: url(/_blob/e70cefe43f47d3bd5f067afbc5826a84) format('woff2-variations'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
body { margin: 0; }
</style>
</helmet>
<div class="phone root-type {{themeClass}} {{modeClass}}">
  <img class="map" src="{{mapSrc}}" alt="">
  <div class="veh" style="left: 96px; top: 210px; background: #d40000;">
    <svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.1V7a4 4 0 0 0 8 0V3.1"/><path d="m9 15-1-1"/><path d="m15 15 1-1"/><path d="M9 19c-2.8 0-5-2.2-5-5v-4a8 8 0 0 1 16 0v4c0 2.8-2.2 5-5 5Z"/><path d="m8 19-2 3"/><path d="m16 19 2 3"/></svg>
  </div>
  <div class="veh" style="left: 214px; top: 276px; background: #1f7fc4;">
    <svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg>
  </div>
  <div class="veh" style="left: 150px; top: 520px; background: #1f7fc4;">
    <svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg>
  </div>
  <div class="live">
    <div class="mat rim"></div>
    <svg class="ic" style="color: var(--tint-mint); stroke-width: 2.5;" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
    <span class="live-t">Naživo</span><span class="live-c">4s</span>
  </div>
  <button class="attrib" aria-label="Zdroje mapy"><div class="mat rim"></div><span>i</span></button>
  <div class="dim" style="opacity: {{dim}};"></div>

  <div class="sheet" style="left: {{inset}}px; right: {{inset}}px; bottom: {{bottom}}px; height: {{height}}px; border-radius: {{rTop}}px {{rTop}}px {{rBottom}}px {{rBottom}}px; transition: {{transition}};">
    <div class="mat rim {{rimClass}}" style="background: {{matBackground}}; transition: background .5s;"></div>

    <div class="float" style="opacity: {{floatOpacity}}; margin-right: {{floatRight}}px;">
      <div class="pill">
        <div class="mat rim"></div>
        <button class="round" aria-label="Nastavenia">
          <svg class="ic" width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div class="pill-sep"></div>
        <button class="round" aria-label="Moja poloha">
          <svg class="ic" width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h3"/><path d="M19 12h3"/><path d="M12 2v3"/><path d="M12 19v3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="sheet-in">
      <button class="grab" style="height: {{grabHeight}}px; transition: {{transition}};" aria-label="Zmeniť výšku panela" onPointerDown="{{onDown}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerCancel="{{onUp}}" onClick="{{onKeyClick}}"><span></span></button>

      <div class="search-row" style="padding: 0 {{rowPad}}px; transition: {{transition}};">
        <button class="field" aria-label="Hľadať">
          <span class="field-fill"></span>
          <svg class="ic" style="position: relative;" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="field-text">Hľadať zastávky, linky…</span>
        </button>
        <button class="round well" aria-label="Zmeniť mesto">
          <svg class="ic" width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
        </button>
      </div>

      <div class="sections" style="opacity: {{sectionsOpacity}}; overflow-y: {{overflow}};">
        <section>
          <a class="sec-head" href="#"><h2 class="sec-title">Obľúbené</h2><svg class="ic sec-chev" style="stroke-width: 2.5;" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
          <div class="fav-strip">
            <sc-for list="{{favorites}}" as="f" hint-placeholder-count="2">
              <div class="fav">
                <div class="fav-top"><span class="lb lg" style="background: {{f.color}};">{{f.line}}</span><span class="t-time" style="margin-left: auto;">{{f.mins}}</span></div>
                <div class="t-row" style="margin-top: 9px;">{{f.head}}</div>
                <div class="t-sub">{{f.stop}}</div>
              </div>
            </sc-for>
          </div>
        </section>

        <section>
          <div class="sec-head"><h2 class="sec-title">Nablízku</h2></div>
          <div class="group">
            <sc-for list="{{nearby}}" as="n" hint-placeholder-count="3">
              <button class="row">
                <span class="avatar"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.1V7a4 4 0 0 0 8 0V3.1"/><path d="m9 15-1-1"/><path d="m15 15 1-1"/><path d="M9 19c-2.8 0-5-2.2-5-5v-4a8 8 0 0 1 16 0v4c0 2.8-2.2 5-5 5Z"/><path d="m8 19-2 3"/><path d="m16 19 2 3"/></svg></span>
                <span class="grow">
                  <span class="t-row" style="display: block;">{{n.name}}</span>
                  <span class="badges">
                    <sc-for list="{{n.lines}}" as="l" hint-placeholder-count="3"><span class="lb" style="background: {{l.color}};">{{l.name}}</span></sc-for>
                  </span>
                </span>
                <span style="text-align: right;">
                  <span class="t-time" style="display: block;">{{n.mins}}</span>
                  <span class="t-sub">{{n.walk}}</span>
                </span>
                <sc-if value="{{n.sep}}" hint-placeholder-val="{{true}}"><span class="row-sep"></span></sc-if>
              </button>
            </sc-for>
          </div>
        </section>

        <section>
          <div class="sec-head"><h2 class="sec-title">Sieť</h2></div>
          <div class="group">
            <button class="row">
              <svg class="ic" style="color: var(--tint-red);" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
              <span class="grow t-plain">Mimoriadnosti a výluky</span>
              <svg class="ic chev" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              <span class="row-sep plain"></span>
            </button>
            <button class="row">
              <svg class="ic" style="color: var(--label-2);" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
              <span class="grow t-plain">Štatistiky siete</span>
              <svg class="ic chev" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              <span class="row-sep plain"></span>
            </button>
            <button class="row">
              <svg class="ic" style="color: var(--label-2);" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <span class="grow t-plain">Odoslať spätnú väzbu</span>
              <svg class="ic chev" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"detent":{"editor":"enum","options":["peek","half","full"],"default":"peek"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"mode":{"editor":"enum","options":["glass","contrast"],"default":"glass"},"$preview":{"width":390,"height":844}}'>
const HEIGHTS = { peek: 68, half: 473, full: 788 };
const DETENTS = ['peek', 'half', 'full'];
const EASE = '.5s cubic-bezier(.32,.72,0,1)';
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { height: null, dragging: false };
    this.drag = null;
    this.suppressClick = false;
  }

  current() {
    return this.state.height ?? HEIGHTS[this.props.detent ?? 'peek'];
  }

  renderVals() {
    const height = this.current();
    const m = clamp((height - HEIGHTS.peek) / (HEIGHTS.half - HEIGHTS.peek), 0, 1);
    const up = clamp((height - HEIGHTS.half) / (HEIGHTS.full - HEIGHTS.half), 0, 1);
    const dark = (this.props.theme ?? 'dark') === 'dark';
    return {
      themeClass: dark ? 'th-dark' : 'th-light',
      modeClass: this.props.mode === 'contrast' ? 'contrast' : '',
      mapSrc: dark ? '/_blob/865bbeb5ef36d05a251b1ba44071d2ea' : '/_blob/2607bf352327c394b4518b5bc32746fd',
      height,
      m,
      rimClass: m >= 1 ? 'rim-top' : '',
      matBackground: up >= 0.6 ? 'var(--mat-solid)' : 'var(--mat-thick)',
      rowPad: 12 + 4 * m,
      grabHeight: 12 + 4 * m,
      inset: 12 * (1 - m),
      bottom: 12 * (1 - m),
      rTop: 34 + 4 * m,
      rBottom: 34 * (1 - m),
      dim: up * 0.25,
      floatOpacity: 1 - up * 3 < 0 ? 0 : 1 - up * 3,
      floatRight: 12 * m,
      sectionsOpacity: clamp((m - 0.2) / 0.6, 0, 1),
      overflow: up >= 1 ? 'auto' : 'hidden',
      transition: this.state.dragging ? 'none' : ['height', 'left', 'right', 'bottom', 'border-radius', 'padding'].map(p => `${p} ${EASE}`).join(', '),
      favorites: [
        { line: 'A', color: '#00A562', mins: '2 min', head: 'Depo Hostivař', stop: 'Náměstí Míru' },
        { line: '22', color: '#7A0603', mins: '5 min', head: 'Bílá Hora', stop: 'I. P. Pavlova' },
      ],
      nearby: [
        { name: 'Náměstí Míru', mins: '2 min', walk: '180 m', sep: true, lines: [{ name: 'A', color: '#00A562' }, { name: '4', color: '#7A0603' }, { name: '22', color: '#7A0603' }] },
        { name: 'I. P. Pavlova', mins: '5 min', walk: '420 m', sep: true, lines: [{ name: 'C', color: '#CF003D' }, { name: '10', color: '#7A0603' }, { name: '16', color: '#7A0603' }] },
        { name: 'Jana Masaryka', mins: '7 min', walk: '510 m', sep: false, lines: [{ name: '135', color: '#007DA8' }] },
      ],
      onDown: e => {
        e.currentTarget.setPointerCapture(e.pointerId);
        const phone = e.currentTarget.closest('.phone');
        this.drag = { y: e.clientY, from: this.current(), scale: phone.getBoundingClientRect().height / phone.offsetHeight, moved: 0 };
        this.setState({ height: this.current(), dragging: true });
      },
      onMove: e => {
        if (!this.drag) return;
        const delta = (this.drag.y - e.clientY) / this.drag.scale;
        this.drag.moved = Math.max(this.drag.moved, Math.abs(delta));
        this.setState({ height: clamp(this.drag.from + delta, HEIGHTS.peek - 12, HEIGHTS.full + 12) });
      },
      onUp: () => {
        if (!this.drag) return;
        const { moved } = this.drag;
        this.drag = null;
        this.suppressClick = true;
        const at = this.current();
        const nearest = DETENTS.reduce((best, d) => (Math.abs(HEIGHTS[d] - at) < Math.abs(HEIGHTS[best] - at) ? d : best), 'peek');
        this.setState({ dragging: false, height: moved < 6 ? this.cycle(nearest) : HEIGHTS[nearest] });
      },
      onKeyClick: () => {
        if (this.suppressClick) { this.suppressClick = false; return; }
        this.setState({ height: this.cycle(this.nearest()) });
      },
    };
  }

  nearest() {
    const at = this.current();
    return DETENTS.reduce((best, d) => (Math.abs(HEIGHTS[d] - at) < Math.abs(HEIGHTS[best] - at) ? d : best), 'peek');
  }

  cycle(detent) {
    return HEIGHTS[DETENTS[(DETENTS.indexOf(detent) + 1) % DETENTS.length]];
  }
}
</script>
</body>
</html>
