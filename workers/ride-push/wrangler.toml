name = "departs-ride-push"
# Workers Builds deploys this from master when a build watch path changes (docs/ride-push-deployment.md, step 4).
main = "../../functions/_workers/ridePush.ts"
compatibility_date = "2026-03-17"
# Hosts, contact and the VAPID public key come from shared/site.ts; API_ORIGIN (a --var) overrides SITE.URL in local dev.
# Reached only through the Pages `RIDE_WATCH` binding; no public URL.
workers_dev = false
preview_urls = false

[secrets]
required = ["VAPID_PRIVATE_KEY"]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "RIDE_WATCH"
class_name = "RideWatch"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RideWatch"]

[[durable_objects.bindings]]
name = "DISRUPTION_WATCH"
class_name = "DisruptionWatch"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DisruptionWatch"]
