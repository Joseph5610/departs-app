name: Sync Stops

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # Run daily at 3:00 AM

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Sync PID Stops
        run: npx tsx scripts/prague/sync-stops.ts

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "data: sync pid stops enrichment data"
          file_pattern: "functions/_data/cities/prague/stops-enrichment.json"
