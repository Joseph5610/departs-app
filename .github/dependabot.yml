# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      # typescript-eslint peers on typescript ">=4.8.4 <6.1.0" (still true on 8.70.0),
      # so a TS 7 bump makes `npm clean-install` fail with ERESOLVE.
      # Drop this entry once typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - "wrangler"
      typescript:
        # Must move in lockstep: typescript-eslint constrains the typescript range.
        patterns:
          - "typescript"
          - "typescript-eslint"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
      types:
        patterns:
          - "@types/*"
      i18n:
        patterns:
          - "*i18next*"
